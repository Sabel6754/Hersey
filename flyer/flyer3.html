<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Montserrat:wght@500;600;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#0d0705;color:#fff3d8;font-family:"Montserrat",sans-serif}
.photo{position:absolute;inset:0;background:url(images/work/10-neon-butterfly-xl.jpg) 50% 18%/cover;filter:saturate(1.2) contrast(1.08)}
.shade{position:absolute;inset:0;background:
 linear-gradient(180deg,rgba(13,7,5,.72) 0%,rgba(13,7,5,0) 22%,rgba(13,7,5,0) 30%,rgba(13,7,5,.86) 52%,#0d0705 74%),
 radial-gradient(900px 520px at 50% 100%,rgba(228,105,15,.55),transparent 70%)}
.heat{position:absolute;left:-200px;right:-200px;bottom:-260px;height:620px;background:radial-gradient(closest-side,rgba(255,120,20,.55),rgba(176,20,40,.3) 55%,transparent 75%)}
.logo{position:absolute;top:44px;left:0;right:0;text-align:center}
.logo img{height:128px;margin:0 auto;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6))}
.hs{position:absolute;top:610px;left:0;right:0;text-align:center;font:italic 500 98px/1 "Bodoni Moda";color:#fff3d8;text-shadow:0 4px 30px rgba(0,0,0,.8)}
.hs small{display:block;font:600 26px/1 "Montserrat";font-style:normal;letter-spacing:.5em;text-transform:uppercase;color:#f3d789;margin-bottom:14px}
.big{position:absolute;top:768px;left:0;right:0;text-align:center;font:500 340px/1 "Bodoni Moda";letter-spacing:-.04em;
 background:linear-gradient(180deg,#fff3b0 0%,#f3c24a 40%,#c4780f 85%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 28px rgba(255,160,30,.65)) drop-shadow(0 12px 24px rgba(0,0,0,.6))}
.sub{position:absolute;top:1084px;left:0;right:0;text-align:center;font:800 31px/1.1 "Montserrat";letter-spacing:.06em;text-transform:uppercase;text-shadow:0 3px 16px rgba(0,0,0,.7)}
.sub span{color:#f3d789}
.ribbon{position:absolute;top:1142px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#e4690f,#ff8a1f);color:#fff;font:800 30px/1 "Montserrat";letter-spacing:.22em;text-transform:uppercase;padding:18px 46px;border-radius:99px;box-shadow:0 10px 30px rgba(228,105,15,.6),0 0 0 3px rgba(255,243,216,.9)}
.bar{position:absolute;left:0;right:0;bottom:0;height:128px;background:linear-gradient(90deg,#f3c24a,#e8a42a 50%,#f3c24a);color:#1a0d04;display:flex;align-items:center;justify-content:space-between;padding:0 54px}
.bar .p{font:500 66px/1 "Bodoni Moda"}
.bar .s{text-align:right;font:700 25px/1.35 "Montserrat";letter-spacing:.1em;text-transform:uppercase}
.tag{position:absolute;top:196px;left:0;right:0;text-align:center;font:600 24px/1 "Montserrat";letter-spacing:.42em;text-transform:uppercase;color:#f3d789;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.sp{position:absolute;width:44px;height:44px;background:#fff3b0;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);filter:drop-shadow(0 0 10px #ffc94a)}
</style></head><body>
<div class="photo"></div><div class="shade"></div><div class="heat"></div>
<div class="logo"><img src="images/logo-gold.png"></div>
<div class="tag">Nails &amp; Lips · North Miami Beach</div>
<div class="hs"><small>November &amp; December</small>Holiday Special</div>
<div class="big">$50</div>
<div class="sub">Acrylic or Gel-X <span>·</span> any style <span>·</span> any length</div>
<div class="ribbon">+ Free Lipstick</div>
<div class="bar"><div class="p">(786) 459-7612</div><div class="s">DM or text to book<br>@loversluxury1</div></div>
<div class="sp" style="left:86px;top:520px"></div><div class="sp" style="left:930px;top:300px;width:60px;height:60px"></div>
<div class="sp" style="left:960px;top:760px;width:32px;height:32px"></div><div class="sp" style="left:60px;top:840px;width:34px;height:34px"></div>
<div class="sp" style="left:840px;top:610px;width:26px;height:26px"></div>
</body></html>
